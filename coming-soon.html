<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meridian — Coming Soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #1b1330;
  --bg-deep: #140d24;
  --gold: #d9b54a;
  --ink: #f2ece4;
  --ink-dim: rgba(242, 236, 228, 0.62);
  --line: rgba(242, 236, 228, 0.14);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
}

body {
  position: relative;
  overflow-x: hidden;
  display: flex;
  justify-content: center;
}

.glow {
  position: absolute;
  top: -18%;
  left: 50%;
  transform: translateX(-50%);
  width: 900px;
  height: 900px;
  background: radial-gradient(circle, rgba(217, 181, 74, 0.16) 0%, rgba(217, 181, 74, 0) 62%);
  pointer-events: none;
}

.wrap {
  position: relative;
  width: 100%;
  max-width: 640px;
  min-height: 100vh;
  padding: 48px 28px 32px;
  display: flex;
  flex-direction: column;
}

.mark {
  font-family: 'Fraunces', serif;
  font-size: 1.15rem;
  letter-spacing: 0.02em;
  color: var(--gold);
}

.hero {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 40px 0;
}

.hero h1 {
  font-family: 'Fraunces', serif;
  font-weight: 500;
  font-size: clamp(2.4rem, 7vw, 3.6rem);
  line-height: 1.08;
  margin: 0 0 22px;
  max-width: 11ch;
}

.sub {
  font-size: 1.02rem;
  line-height: 1.6;
  color: var(--ink-dim);
  max-width: 42ch;
  margin: 0 0 32px;
}

.signup {
  display: flex;
  gap: 10px;
  max-width: 420px;
}

.signup input {
  flex: 1;
  min-width: 0;
  padding: 14px 16px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: rgba(242, 236, 228, 0.04);
  color: var(--ink);
  font-size: 0.95rem;
  font-family: inherit;
}

.signup input::placeholder { color: rgba(242, 236, 228, 0.35); }

.signup input:focus,
.signup button:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 2px;
}

.signup button {
  padding: 14px 22px;
  border-radius: 8px;
  border: none;
  background: var(--gold);
  color: var(--bg-deep);
  font-family: inherit;
  font-weight: 600;
  font-size: 0.95rem;
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.15s ease;
}

.signup button:hover { background: #eac862; }

.note {
  margin: 12px 0 0;
  font-size: 0.82rem;
  color: rgba(242, 236, 228, 0.4);
}

.note.success { color: var(--gold); }
.note.error { color: #e08a8a; }

.countdown {
  display: flex;
  gap: 22px;
  margin-top: 44px;
}

.unit {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
}

.unit span {
  font-family: 'Fraunces', serif;
  font-weight: 500;
  font-size: 1.9rem;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}

.unit small {
  font-size: 0.75rem;
  color: var(--ink-dim);
  margin-top: 2px;
}

.foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-top: 20px;
  border-top: 1px solid var(--line);
  font-size: 0.8rem;
  color: var(--ink-dim);
}

.socials { display: flex; gap: 14px; }

.socials a {
  display: inline-flex;
  color: var(--ink-dim);
  transition: color 0.15s ease;
}

.socials a:hover { color: var(--gold); }

.socials svg {
  width: 16px;
  height: 16px;
  fill: currentColor;
}

@media (max-width: 460px) {
  .signup { flex-direction: column; }
  .countdown { gap: 16px; flex-wrap: wrap; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>

  <div class="glow"></div>

  <div class="wrap">
    <header class="mark">Meridian</header>

    <main class="hero">
      <h1>Good things<br>are worth the wait.</h1>
      <p class="sub">
        We're putting the finishing touches on something new.
        Leave your email and we'll let you know the moment it opens.
      </p>

      <form id="signup" class="signup" novalidate>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required>
        <button type="submit">Notify me</button>
      </form>
      <p class="note" id="formNote">No spam, one email when we launch.</p>

      <div class="countdown" id="countdown" aria-label="Time until launch">
        <div class="unit"><span id="days">00</span><small>Days</small></div>
        <div class="unit"><span id="hours">00</span><small>Hours</small></div>
        <div class="unit"><span id="minutes">00</span><small>Minutes</small></div>
        <div class="unit"><span id="seconds">00</span><small>Seconds</small></div>
      </div>
    </main>

    <footer class="foot">
      <span>&copy; 2026 Meridian</span>
      <div class="socials">
        <a href="#" aria-label="X / Twitter">
          <svg viewBox="0 0 24 24"><path d="M3 3l7.5 9.6L3.4 21H6l5.8-6.7L16.7 21H21l-7.9-10.1L20.7 3H18l-5.3 6.1L8.3 3H3z"/></svg>
        </a>
        <a href="#" aria-label="Instagram">
          <svg viewBox="0 0 24 24"><path d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5zm0 2a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3V7a3 3 0 0 0-3-3H7zm5 3.5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9zm0 2a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zm4.75-.9a1.05 1.05 0 1 1 0-2.1 1.05 1.05 0 0 1 0 2.1z"/></svg>
        </a>
      </div>
    </footer>
  </div>

<script>
// Set your real launch date here
const LAUNCH_DATE = new Date();
LAUNCH_DATE.setDate(LAUNCH_DATE.getDate() + 45);

const els = {
  days: document.getElementById('days'),
  hours: document.getElementById('hours'),
  minutes: document.getElementById('minutes'),
  seconds: document.getElementById('seconds'),
};

function pad(n) {
  return String(n).padStart(2, '0');
}

function tick() {
  const diff = LAUNCH_DATE - new Date();

  if (diff <= 0) {
    els.days.textContent = '00';
    els.hours.textContent = '00';
    els.minutes.textContent = '00';
    els.seconds.textContent = '00';
    return;
  }

  const day = Math.floor(diff / (1000 * 60 * 60 * 24));
  const hour = Math.floor((diff / (1000 * 60 * 60)) % 24);
  const min = Math.floor((diff / (1000 * 60)) % 60);
  const sec = Math.floor((diff / 1000) % 60);

  els.days.textContent = pad(day);
  els.hours.textContent = pad(hour);
  els.minutes.textContent = pad(min);
  els.seconds.textContent = pad(sec);
}

tick();
setInterval(tick, 1000);

// Signup form
const form = document.getElementById('signup');
const emailInput = document.getElementById('email');
const note = document.getElementById('formNote');

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const value = emailInput.value.trim();
  const isValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);

  if (!isValid) {
    note.textContent = 'That email doesn\'t look right — mind checking it?';
    note.className = 'note error';
    return;
  }

  // Wire this up to your real signup endpoint / provider.
  note.textContent = "You're on the list — we'll email you at launch.";
  note.className = 'note success';
  emailInput.value = '';
  emailInput.disabled = true;
  form.querySelector('button').disabled = true;
});
</script>
</body>
</html>
