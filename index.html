<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meridian — Coming Soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="glow"></div>

  <div class="wrap">
    <header class="mark">Meridian</header>

    <main class="hero">
      <h1>Good things<br>are worth the wait.</h1>
      <p class="sub">
        We're putting the finishing touches on something new.
        Leave your email and we'll let you know the moment it opens.
      </p>

      <form id="signup" class="signup" novalidate>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required>
        <button type="submit">Notify me</button>
      </form>
      <p class="note" id="formNote">No spam, one email when we launch.</p>

      <div class="countdown" id="countdown" aria-label="Time until launch">
        <div class="unit"><span id="days">00</span><small>Days</small></div>
        <div class="unit"><span id="hours">00</span><small>Hours</small></div>
        <div class="unit"><span id="minutes">00</span><small>Minutes</small></div>
        <div class="unit"><span id="seconds">00</span><small>Seconds</small></div>
      </div>
    </main>

    <footer class="foot">
      <span>&copy; 2026 Meridian</span>
      <div class="socials">
        <a href="#" aria-label="X / Twitter">
          <svg viewBox="0 0 24 24"><path d="M3 3l7.5 9.6L3.4 21H6l5.8-6.7L16.7 21H21l-7.9-10.1L20.7 3H18l-5.3 6.1L8.3 3H3z"/></svg>
        </a>
        <a href="#" aria-label="Instagram">
          <svg viewBox="0 0 24 24"><path d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5zm0 2a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3V7a3 3 0 0 0-3-3H7zm5 3.5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9zm0 2a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zm4.75-.9a1.05 1.05 0 1 1 0-2.1 1.05 1.05 0 0 1 0 2.1z"/></svg>
        </a>
      </div>
    </footer>
  </div>

<script src="script.js"></script>
</body>
</html>
